[build]
  publish = "dist"
  command = "npm run build"

# Optional: If you host your backend server on Cloud Run / Railway / Render,
# you can uncomment this proxy redirect to forward all /api requests automatically:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-service.run.app/api/:splat"
#   status = 200
#   force = true

# Single Page Application (SPA) fallback for Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
